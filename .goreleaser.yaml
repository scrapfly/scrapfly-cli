version: 2

project_name: scrapfly

builds:
  - id: scrapfly
    main: ./cmd/scrapfly
    binary: scrapfly
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

universal_binaries:
  - id: scrapfly
    ids:
      - scrapfly
    name_template: scrapfly
    # Keep both the universal binary AND the per-arch darwin builds so users
    # on Apple Silicon can grab the leaner arm64-only archive if they want.
    replace: false

# Developer ID signature + Apple notarization of the three darwin binaries
# (amd64, arm64, universal: they share the build id). Runs before archives, so
# the tarballs and checksums-darwin.txt carry the signed bytes. A bare binary
# cannot be stapled: Gatekeeper looks the notarization up online on first run.
# No `enabled` gate on a secret: an unsigned macOS release must fail, not ship.
notarize:
  macos:
    - enabled: true
      ids:
        - scrapfly
      sign:
        # base64 of the Developer ID Application .p12
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # App Store Connect API key (base64 of the .p8)
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats: [tar.gz]
    # Deterministic {os}-{arch} naming for installer.sh consumption:
    #   scrapfly-darwin-amd64.tar.gz
    #   scrapfly-darwin-arm64.tar.gz
    #   scrapfly-darwin-universal.tar.gz
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums-darwin.txt

release:
  # The release workflow runs goreleaser with --skip=publish and uploads
  # the dist/ artifacts via actions/upload-artifact; the publish job cuts
  # the GitHub release. This `disable: true` is belt-and-braces in case a
  # future invocation forgets --skip=publish.
  disable: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

